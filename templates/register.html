{% extends "base.html" %}

{% block title %}Student Registration - Study Planner{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h2>Create Student Account</h2>
            <p>Join the intelligent study planner with Machine Learning recommendations</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="name"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Alex Johnson" value="{{ name or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> College / Personal Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu" value="{{ email or '' }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 chars" minlength="6" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fa-solid fa-user-check"></i> Register &amp; Start Planning
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
