{% extends "base.html" %}

{% block title %}Student Login - Study Planner{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2>Student Portal Login</h2>
            <p>Access your personalized dashboard &amp; study recommendations</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-muted);">
            New student? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
